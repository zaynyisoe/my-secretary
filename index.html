  <script>
    (function generateAppIcon() {
      const size = 180;
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      const bgGrad = ctx.createLinearGradient(0, 0, size, size);
      bgGrad.addColorStop(0, '#0f172a');
      bgGrad.addColorStop(1, '#1e293b');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, size, size);

      function drawRoundedRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
      }
      drawRoundedRect(34, 38, 112, 104, 22);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
      ctx.fill();
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = 'rgba(96, 165, 250, 0.5)';
      ctx.stroke();

      drawRoundedRect(54, 92, 18, 32, 6);
      ctx.fillStyle = '#60a5fa';
      ctx.fill();
      drawRoundedRect(81, 74, 18, 50, 6);
      ctx.fillStyle = '#34d399';
      ctx.fill();
      drawRoundedRect(108, 56, 18, 68, 6);
      ctx.fillStyle = '#fbbf24';
      ctx.fill();

      const pngUrl = canvas.toDataURL('image/png');
      document.getElementById('apple-touch-icon').href = pngUrl;
      document.getElementById('favicon-icon').href = pngUrl;
    })();
  </script>

    function renderChecklist() {
      const container = document.getElementById('checklist-container');
      container.innerHTML = '';
      
      const savedChecks = JSON.parse(localStorage.getItem('sec_checklist') || '{}');

      // Group by categories
      const categories = [...new Set(checklistData.map(item => item.category))];

      categories.forEach(cat => {
        const catTitle = document.createElement('div');
        catTitle.className = 'checklist-category-title';
        catTitle.textContent = cat;
        container.appendChild(catTitle);

        const items = checklistData.filter(i => i.category === cat);
        items.forEach(item => {
          const isChecked = savedChecks[item.id] || false;
          const div = document.createElement('div');
          div.className = 'checklist-item';
          
          let sublinesHtml = item.sublines.map(sub => `<span class="checklist-sub">${sub}</span>`).join('');

          div.innerHTML = `
            <input type="checkbox" data-id="${item.id}" ${isChecked ? 'checked' : ''} />
            <div class="checklist-content">
              <span class="checklist-label ${isChecked ? 'completed' : ''}">${item.label}</span>
              ${sublinesHtml}
            </div>
          `;
          container.appendChild(div);
        });
      });
    }

    document.getElementById('checklist-container').addEventListener('change', (e) => {
      if (e.target.type === 'checkbox') {
        const id = e.target.dataset.id;
        const savedChecks = JSON.parse(localStorage.getItem('sec_checklist') || '{}');
        savedChecks[id] = e.target.checked;
        localStorage.setItem('sec_checklist', JSON.stringify(savedChecks));
        renderChecklist();
      }
    });

    function renderApp() {
      const selectedMonth = monthFilter.value;
      const monthTxs = transactions.filter(t => t.date && t.date.startsWith(selectedMonth));

      const totalIncome = monthTxs.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
      const totalExpense = monthTxs.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
      const balance = totalIncome - totalExpense;

      document.getElementById('total-income').textContent = formatNT(totalIncome);
      document.getElementById('total-income-ks').textContent = `≈ ${formatKs(totalIncome)}`;
      document.getElementById('total-expense').textContent = formatNT(totalExpense);
      document.getElementById('total-expense-ks').textContent = `≈ ${formatKs(totalExpense)}`;
      
      const balEl = document.getElementById('total-balance');
      balEl.textContent = formatNT(balance);
      balEl.style.color = balance >= 0 ? '#ffffff' : '#f87171';
      document.getElementById('total-balance-ks').textContent = `≈ ${formatKs(balance)}`;

      txList.innerHTML = '';
      if (monthTxs.length === 0) {
        txList.innerHTML = '<div class="empty-state">မှတ်တမ်း မရှိသေးပါ</div>';
        return;
      }

      monthTxs.forEach(t => {
        const li = document.createElement('li');
        li.className = 'tx-item';
        const sign = t.type === 'income' ? '+' : '−';
        const colorClass = t.type === 'income' ? 'income-text' : 'expense-text';

        li.innerHTML = `
          <div class="tx-info">
            <span class="tx-note">${t.note}</span>
            <span class="tx-meta">${t.category} • ${t.date}</span>
          </div>
          <div class="tx-right">
            <div>
              <span class="tx-amount ${colorClass}">${sign} ${formatNT(t.amount)}</span>
              <span class="tx-amount-ks">≈ ${formatKs(t.amount)}</span>
            </div>
            <button class="del-btn" data-id="${t.id}" title="ဖျက်ရန်">×</button>
          </div>
        `;
        txList.appendChild(li);
      });
    }

    updateCategoryOptions('expense');
    renderApp();
    renderChecklist();
  </script>
