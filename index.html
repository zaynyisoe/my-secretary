<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>အတွင်းရေးမှူး (ငွေစာရင်းသီးသန့်)</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="အတွင်းရေးမှူး">
  <meta name="theme-color" content="#0f172a">
  <link rel="apple-touch-icon" id="apple-touch-icon" sizes="180x180" href="">
  <link rel="icon" type="image/png" id="favicon-icon" href="">

  <script>
    (function generateAppIcon() {
      const size = 180;
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, size, size);
      
      ctx.fillStyle = '#34d399';
      ctx.beginPath();
      ctx.arc(90, 90, 45, 0, Math.PI * 2);
      ctx.fill();

      const pngUrl = canvas.toDataURL('image/png');
      document.getElementById('apple-touch-icon').href = pngUrl;
      document.getElementById('favicon-icon').href = pngUrl;
    })();
  </script>

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-body: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --green: #10b981;
      --red: #ef4444;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: #cbd5e1;
      font-family: 'Noto Sans Myanmar', -apple-system, sans-serif;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    .app-container {
      width: 100%;
      max-width: 480px;
      background-color: var(--bg-body);
      min-height: 100vh;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.15);
      padding-bottom: 40px;
    }
    .top-header {
      background: #0f172a;
      color: #ffffff;
      padding: calc(20px + env(safe-area-inset-top)) 20px 24px;
      border-bottom-left-radius: 24px;
      border-bottom-right-radius: 24px;
    }
    .header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .app-title { font-size: 16px; font-weight: 700; letter-spacing: -0.5px; }
    .rate-box { background: rgba(255,255,255,0.1); padding: 4px 8px; border-radius: 6px; font-size: 11px; color: #34d399; }
    .rate-input { width: 45px; background: transparent; border: none; color: #34d399; font-weight: 700; font-family: inherit; font-size: 11px; outline: none; text-align: right; }

    .balance-display { text-align: center; }
    .balance-label { font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
    .balance-amount { font-size: 32px; font-weight: 700; letter-spacing: -1px; }
    .balance-ks { font-size: 13px; color: #34d399; font-weight: 600; margin-top: 2px; }

    .card { background: var(--card-bg); padding: 16px; border-radius: 14px; border: 1px solid var(--border); margin: 14px 14px 0; }
    
    .type-toggle { display: grid; grid-template-columns: 1fr 1fr; background: #e2e8f0; padding: 3px; border-radius: 10px; margin-bottom: 14px; }
    .type-btn { border: none; background: transparent; padding: 8px; font-family: inherit; font-size: 12px; font-weight: 600; color: var(--text-muted); border-radius: 8px; cursor: pointer; }
    .type-btn.active-exp { background: var(--red); color: #fff; }
    .type-btn.active-inc { background: var(--green); color: #fff; }

    .form-group { margin-bottom: 10px; }
    label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px; font-weight: 600; }
    input, select { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-family: inherit; font-size: 14px; outline: none; background: #fff; }
    input:focus, select:focus { border-color: var(--text-main); }

    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn-submit { width: 100%; background: var(--text-main); color: #fff; border: none; padding: 12px; border-radius: 8px; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; margin-top: 4px; }

    .tx-list { list-style: none; }
    .tx-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .tx-item:last-child { border-bottom: none; }
    .tx-note { font-size: 13px; font-weight: 600; }
    .tx-sub { font-size: 11px; color: var(--text-muted); }
    .tx-amt { font-size: 13px; font-weight: 700; text-align: right; }
    .tx-amt-ks { font-size: 10px; color: var(--text-muted); }

    .del-btn { background: none; border: none; color: #94a3b8; font-size: 16px; cursor: pointer; padding: 4px; }
    .del-btn:hover { color: var(--red); }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="top-header">
      <div class="header-flex">
        <div class="app-title">💰 အတွင်းရေးမှူး (ငွေစာရင်း)</div>
        <div class="rate-box">
          1 NT$ = <input type="number" id="ex-rate" class="rate-input" value="110" /> Ks
        </div>
      </div>
      <div class="balance-display">
        <div class="balance-label">ယခုလ လက်ကျန်ငွေ</div>
        <div class="balance-amount" id="bal-amt">NT$ 0</div>
        <div class="balance-ks" id="bal-ks">≈ Ks 0</div>
      </div>
    </div>

    <!-- Finance Form Card -->
    <div class="card">
      <div class="type-toggle">
        <button type="button" class="type-btn active-exp" id="btn-exp">− အသုံးစရိတ်</button>
        <button type="button" class="type-btn" id="btn-inc">+ ဝင်ငွေ</button>
      </div>

      <form id="tx-form">
        <div class="row-2 form-group">
          <div>
            <label>ပမာဏ (NT$)</label>
            <input type="number" id="amt" placeholder="100" required min="1" step="any" />
          </div>
          <div>
            <label>အမျိုးအစား</label>
            <select id="cat"></select>
          </div>
        </div>
        <div class="row-2 form-group">
          <div>
            <label>မှတ်ချက်</label>
            <input type="text" id="note" placeholder="ကော်ဖီ / ထမင်း" required />
          </div>
          <div>
            <label>ရက်စွဲ</label>
            <input type="date" id="date" required />
          </div>
        </div>
        <button type="submit" class="btn-submit">စာရင်းသွင်းမည်</button>
      </form>
    </div>

    <!-- Transaction List Card -->
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <span style="font-size: 12px; font-weight: 700; color: var(--text-muted);">📜 ယခုလ မှတ်တမ်းများ</span>
        <input type="month" id="month-pick" style="padding: 2px 6px; font-size: 11px; width: auto;" />
      </div>
      <ul class="tx-list" id="tx-list"></ul>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDxYxFGfKAjEUkxSTA8tyR7IVjtYl9t8VU",
      authDomain: "my-secretary-ac73d.firebaseapp.com",
      projectId: "my-secretary-ac73d",
      storageBucket: "my-secretary-ac73d.firebasestorage.app",
      messagingSenderId: "70001992527",
      appId: "1:70001992527:web:9801914a4dd8e6528c1b3a"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    signInAnonymously(auth).catch(console.error);

    let rate = parseFloat(localStorage.getItem('pure_rate')) || 110;
    document.getElementById('ex-rate').value = rate;
    document.getElementById('ex-rate').addEventListener('input', (e) => {
      rate = parseFloat(e.target.value) || 110;
      localStorage.setItem('pure_rate', rate);
      render();
    });

    const CATEGORIES = {
      expense: ["🍜 စားစရိတ်", "🛵 သွားလာရေး", "💪 Gym / ကျန်းမာ", "💻 Tech / ကျောင်း", "🏠 အဆောင် / ဖုန်းဘေလ်", "🛍️ အထွေထွေ"],
      income: ["💼 လစာ / အချိန်ပိုင်း", "🏠 မိသားစု ပံ့ပိုးငွေ", "✨ အခြားဝင်ငွေ"]
    };

    let currentType = 'expense';
    const catSelect = document.getElementById('cat');
    const btnExp = document.getElementById('btn-exp');
    const btnInc = document.getElementById('btn-inc');

    function updateCats(type) {
      catSelect.innerHTML = '';
      CATEGORIES[type].forEach(c => {
        const opt = document.createElement('option');
        opt.value = c;
        opt.textContent = c;
        catSelect.appendChild(opt);
      });
    }

    btnExp.addEventListener('click', () => {
      currentType = 'expense';
      btnExp.className = 'type-btn active-exp';
      btnInc.className = 'type-btn';
      updateCats('expense');
    });

    btnInc.addEventListener('click', () => {
      currentType = 'income';
      btnInc.className = 'type-btn active-inc';
      btnExp.className = 'type-btn';
      updateCats('income');
    });

    const today = new Date();
    const yyyy = today.getFullYear();
    const mm = String(today.getMonth() + 1).padStart(2, '0');
    const dd = String(today.getDate()).padStart(2, '0');
    document.getElementById('date').value = `${yyyy}-${mm}-${dd}`;
    const monthPick = document.getElementById('month-pick');
    monthPick.value = `${yyyy}-${mm}`;
    monthPick.addEventListener('change', render);

    let transactions = [];
    const q = query(collection(db, "transactions"), orderBy("createdAt", "desc"));
    onSnapshot(q, (snapshot) => {
      transactions = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
      render();
    });

    document.getElementById('tx-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const newTx = {
        type: currentType,
        amount: parseFloat(document.getElementById('amt').value),
        category: catSelect.value,
        note: document.getElementById('note').value.trim(),
        date: document.getElementById('date').value,
        createdAt: Date.now()
      };
      await addDoc(collection(db, "transactions"), newTx);
      document.getElementById('amt').value = '';
      document.getElementById('note').value = '';
    });

    document.getElementById('tx-list').addEventListener('click', async (e) => {
      const btn = e.target.closest('.del-btn');
      if (btn && confirm('ဖျက်မှာ သေချာပါသလား?')) {
        await deleteDoc(doc(db, "transactions", btn.dataset.id));
      }
    });

    function render() {
      const selMonth = monthPick.value;
      const filtered = transactions.filter(t => t.date && t.date.startsWith(selMonth));

      let inc = 0, exp = 0;
      filtered.forEach(t => {
        if (t.type === 'income') inc += t.amount;
        else exp += t.amount;
      });
      const bal = inc - exp;

      document.getElementById('bal-amt').textContent = `NT$ ${bal.toLocaleString()}`;
      document.getElementById('bal-ks').textContent = `≈ Ks ${Math.round(bal * rate).toLocaleString()}`;

      const list = document.getElementById('tx-list');
      list.innerHTML = '';
      if (filtered.length === 0) {
        list.innerHTML = '<div style="text-align:center; color:#94a3b8; font-size:12px; padding:15px 0;">ယခုလ မှတ်တမ်း မရှိသေးပါ။</div>';
        return;
      }

      filtered.forEach(t => {
        const sign = t.type === 'income' ? '+' : '−';
        const color = t.type === 'income' ? '#10b981' : '#0f172a';
        const li = document.createElement('li');
        li.className = 'tx-item';
        li.innerHTML = `
          <div>
            <div class="tx-note">${t.note}</div>
            <div class="tx-sub">${t.category} • ${t.date}</div>
          </div>
          <div style="display:flex; align-items:center; gap:8px;">
            <div style="text-align:right;">
              <div class="tx-amt" style="color: ${color};">${sign} NT$ ${t.amount.toLocaleString()}</div>
              <div class="tx-amt-ks">≈ Ks ${Math.round(t.amount * rate).toLocaleString()}</div>
            </div>
            <button class="del-btn" data-id="${t.id}">×</button>
          </div>
        `;
        list.appendChild(li);
      });
    }

    updateCats('expense');
    render();
  </script>
</body>
</html>
